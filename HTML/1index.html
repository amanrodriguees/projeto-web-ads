<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página de LOGIN</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <fieldset>

        <div class="conteudo-login">

            <img src="logo.png"
                 alt="Logo do site"
                 class="logo-login"
                 width="150">

            <h1 class="tituloPrincipal">
                JUAN - CALÇADOS
            </h1>

            <h2>
                Acesse sua conta:
            </h2>


            <form action="2principal.html">

                <p>
                    <label for="usuario">
                        CPF, CNPJ ou E-mail:
                    </label>
                </p>

                <input type="text"
                       id="usuario"
                       placeholder="escreva aqui..">


                <p>
                    <label for="senha">
                        Senha:
                    </label>
                </p>

                <input type="password"
                       id="senha"
                       placeholder="********"
                       maxlength="8">


                <br><br>

                <button type="submit">
                    Entrar
                </button>

            </form>


            <br>

            <a href="3cadastro.html">
                Novo cadastro
            </a>

            <br><br>

            <a href="4recuperação-senha.html">
                Esqueceu a senha?
            </a>

        </div>

    </fieldset>


    <footer>

        <p>
            &copy; 2026 JUAN - Calçados  - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
