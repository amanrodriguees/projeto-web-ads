<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <fieldset>
        <div class="conteudo-cadastro">

            <img src="logo.png" alt="Logo do site" class="cadastro" width="150">

            <h1 class="tituloPrincipal">JUAN - CALÇADOS</h1>

            <h2>Cadastre-se:</h2>
            <form action="5ok.html">

            <form action="3cadastro.html">

                
                <p>
             <label for="nome">Nome:</label>
            </p>

            <input 
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome..."
            required
            minlength="3"

               
                <p>
                <label for="usuario">CPF, CNPJ ou E-mail:</label>
                
                <input 
                    type="text" 
                    id="usuario" 
                    name="usuario"
                    placeholder="CPF, CNPJ ou E-mail..."
                >
                </p>
                
                <p>
                    <label for="senha">Digite sua senha:</label>
                </p>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha"
                    placeholder="******" 
                    maxlength="8"
                >

                
                <p>
                    <label for="confirmar-senha">Confirme sua senha:</label>
                </p>
                <input 
                    type="password" 
                    id="confirmar-senha" 
                    name="confirmar-senha"
                    placeholder="******" 
                    maxlength="8"
                >

                
                <p>
                    <label for="sexo">Sexo:</label>
                </p>
                <select id="sexo" name="sexo">
                    <option value="">Selecione</option>
                    <option value="feminino">Feminino</option>
                    <option value="masculino">Masculino</option>
                    <option value="outro">Outro</option>
                    <option value="nao-informar">Prefiro não informar</option>
                </select>

                <p>
                    <label for="observacao">Conte um pouco sobre você:</label>
                </p>
                <textarea 
                    id="observacao" 
                    name="observacao"
                    rows="5" 
                    cols="30"
                    placeholder="Digite aqui..."
                ></textarea>

                <br><br>

                
                <a href="5ok.html"><button type="submit">Cadastrar</button></a>

                <a href="1index.html">Voltar</a>

            </form>

        </div>
    </fieldset>

</body>

</html>
